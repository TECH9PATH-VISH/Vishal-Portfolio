<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Typography Sample</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .text-focus {
            max-width: 500px;
            padding: 20px;
            border-left: 2px solid #111111;
            padding-left: 30px;
        }
        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin: 0 0 15px 0;
            letter-spacing: -1px;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #444444;
        }
        .footer-link {
            display: inline-block;
            margin-top: 20px;
            color: #111111;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid #111111;
            padding-bottom: 2px;
        }
        .footer-link:hover {
            color: #666666;
            border-color: #666666;
        }
    </style>
</head>
<body>

    <div class="text-focus">
        <h1>Engineering clean solutions.</h1>
        <p>A minimalist developer workspace centered around modular clean architecture, data validation safety, and fluid reactive client interfaces built completely from scratch.</p>
        <a href="#" class="footer-link">View Selected Registries →</a>
    </div>

</body>
</html>
